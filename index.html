<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreeScroll - TikTok for News</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Search Header -->
        <div class="search-header">
            <div class="search-container">
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/>
                    <path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <input type="text" id="search-input" class="search-input" placeholder="Search news...">
                <button id="clear-search" class="clear-search" style="display: none;">×</button>
            </div>
            <select id="category-select" class="category-select">
                <option value="">All News</option>
                <option value="business">Business</option>
                <option value="entertainment">Entertainment</option>
                <option value="general">General</option>
                <option value="health">Health</option>
                <option value="science">Science</option>
                <option value="sports">Sports</option>
                <option value="technology">Technology</option>
            </select>
        </div>

        <!-- Loading indicator -->
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Loading news...</p>
        </div>

        <!-- Infinite scroll loading indicator -->
        <div id="loading-more" class="loading-more" style="display: none;">
            <div class="spinner-small"></div>
            <p>Loading more...</p>
        </div>

        <!-- Scroll container -->
        <div id="scroll-container" class="scroll-container">
            <!-- News articles will be dynamically inserted here -->
        </div>

        <!-- Navigation indicators -->
        <div class="scroll-indicator">
            <span id="current-index">1</span> / <span id="total-articles">0</span>
        </div>

        <!-- Swipe up hint -->
        <div class="swipe-hint">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path d="M12 19V5M12 5L5 12M12 5L19 12" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Swipe up for more</span>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
